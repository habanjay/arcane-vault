<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Arcane Vault | Page Not Found</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
	<style>
		:root { --ink:#172047; --muted:#727891; --paper:#f1f5f8; --white:#fff; --plum:#281e3e; --pink:#f62570; --coral:#ff7d82; --line:#e5e9f0; --shadow:0 20px 45px rgba(24,29,65,.12); }
		* { box-sizing:border-box; }
		body { display:grid; min-width:320px; min-height:100vh; margin:0; place-items:center; overflow-x:hidden; color:var(--ink); background:var(--paper); font-family:"DM Sans",sans-serif; }
		button, a { font:inherit; }
		button { cursor:pointer; }
		button:focus-visible, a:focus-visible { outline:2px solid var(--pink); outline-offset:3px; }
		.error-page { position:relative; display:grid; width:min(100% - 36px, 640px); min-height:640px; place-items:center; padding:44px 20px; overflow:hidden; }
		.error-page::before { position:absolute; top:-190px; right:-170px; width:410px; height:410px; content:""; border:65px solid rgba(246,37,112,.08); border-radius:50%; }
		.error-page::after { position:absolute; bottom:-190px; left:-160px; width:390px; height:390px; content:""; border-radius:50%; background:rgba(87,48,73,.08); }
		.error-card { position:relative; z-index:1; width:100%; padding:54px 42px 46px; text-align:center; border:1px solid rgba(255,255,255,.75); border-radius:28px; background:rgba(255,255,255,.82); box-shadow:var(--shadow); backdrop-filter:blur(8px); }
		.brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:42px; color:var(--ink); }
		.brand-mark { display:grid; width:38px; height:38px; place-items:center; color:#fff; font-size:20px; border-radius:12px; background:linear-gradient(145deg,#ff4a87,#cb185b); box-shadow:0 8px 18px rgba(246,37,112,.22); }
		.brand strong { font-family:"Plus Jakarta Sans",sans-serif; font-size:16px; letter-spacing:-.4px; }
		.brand small { display:block; margin-top:2px; color:var(--muted); font-size:10px; text-align:left; }
		.error-mark { display:grid; width:78px; height:78px; place-items:center; margin:0 auto 24px; color:var(--coral); font-size:34px; font-weight:700; border:1px solid #ffd1d3; border-radius:24px; background:#fff0f1; }
		.error-code { margin:0; color:var(--plum); font-family:"Plus Jakarta Sans",sans-serif; font-size:clamp(70px,16vw,104px); line-height:.9; letter-spacing:-6px; }
		h1 { margin:22px 0 10px; color:var(--ink); font-family:"Plus Jakarta Sans",sans-serif; font-size:clamp(21px,4vw,27px); letter-spacing:-.8px; }
		.description { max-width:385px; margin:0 auto 28px; color:var(--muted); font-size:13px; line-height:1.65; }
		.actions { display:flex; justify-content:center; gap:10px; }
		.primary-action, .secondary-action { padding:12px 18px; font-size:12px; font-weight:700; border-radius:9px; }
		.primary-action { color:#fff; border:0; background:var(--pink); box-shadow:0 8px 18px rgba(246,37,112,.22); }
		.secondary-action { color:var(--ink); border:1px solid var(--line); background:var(--white); }
		.support { position:relative; z-index:1; margin:20px 0 0; color:var(--muted); font-size:11px; }
		.support button { padding:0; color:var(--pink); font-size:11px; font-weight:700; border:0; background:transparent; }
		@media (max-width:520px) { .error-page { width:min(100% - 24px, 640px); min-height:580px; padding:24px 0; } .error-card { padding:38px 22px 32px; border-radius:22px; } .brand { margin-bottom:34px; } .error-mark { width:68px; height:68px; margin-bottom:20px; border-radius:20px; } .actions { flex-direction:column; } .actions button { width:100%; } }
		@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
	</style>
</head>
<body>
	<main class="error-page" aria-labelledby="error-title">
		<section class="error-card">
			<div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><strong>Arcane Vault</strong><small>Secure your world</small></div></div>
			<div class="error-mark" aria-hidden="true">!</div>
			<p class="error-code" aria-label="Error 404">404</p>
			<h1 id="error-title">This vault page is missing</h1>
			<p class="description">The page you are looking for may have moved, been deleted, or never existed in this vault.</p>
			<div class="actions"><button class="primary-action" id="dashboard-action">Return to dashboard</button><button class="secondary-action" id="retry-action">Try again</button></div>
			<p class="support">Still need a hand? <button id="support-action">Contact support</button></p>
		</section>
	</main>
	<script>
		document.getElementById('dashboard-action').addEventListener('click', event => { event.currentTarget.textContent = 'Opening dashboard'; setTimeout(() => event.currentTarget.textContent = 'Return to dashboard', 1200); });
		document.getElementById('retry-action').addEventListener('click', event => { event.currentTarget.textContent = 'Request sent'; setTimeout(() => event.currentTarget.textContent = 'Try again', 1200); });
		document.getElementById('support-action').addEventListener('click', event => { event.currentTarget.textContent = 'Request opened'; setTimeout(() => event.currentTarget.textContent = 'Contact support', 1400); });
	</script>
</body>
</html>
