<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Edit a saved Arcane Vault password.">
	<title>Arcane Vault | Edit Password</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
	<style>
		:root { --ink:#172047; --muted:#727891; --paper:#f1f5f8; --white:#fff; --plum:#281e3e; --pink:#f62570; --coral:#ff6e76; --line:#e5e9f0; --field:#d4d7df; }
		* { box-sizing:border-box; } body { margin:0; min-width:320px; color:var(--ink); background:#dfe5eb; font-family:"DM Sans",sans-serif; } button,input,select,textarea { font:inherit; } button { cursor:pointer; } button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--pink); outline-offset:3px; }
		.page { width:min(100%,760px); min-height:712px; margin:28px auto; padding:35px 20px 24px; border-radius:24px; background:linear-gradient(#f0edf3,#f1f5f8); box-shadow:0 20px 45px rgba(24,29,65,.12); } header { display:flex; align-items:center; gap:37px; margin-bottom:18px; } .back { display:grid; width:36px; height:36px; place-items:center; color:var(--ink); font-size:27px; line-height:1; text-decoration:none; border-radius:50%; background:#fff; box-shadow:0 8px 18px rgba(24,29,65,.06); } .back:hover { color:var(--pink); } .eyebrow { margin:0 0 4px; color:var(--pink); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; } h1 { margin:0; font-family:"Plus Jakarta Sans"; font-size:17px; letter-spacing:-.5px; } .summary,.section { padding:15px; border-radius:15px; background:var(--white); } .summary { display:flex; align-items:center; gap:12px; margin-bottom:16px; } .service-icon { display:grid; width:51px; height:51px; flex:0 0 51px; place-items:center; color:#fff; font-family:"Plus Jakarta Sans"; font-size:24px; font-weight:700; border-radius:50%; background:var(--plum); } .summary-copy { min-width:0; flex:1; } .summary-copy strong { display:block; font-size:14px; } .summary-copy span { display:block; overflow:hidden; margin-top:4px; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; } .favorite { color:var(--pink); font-size:20px; border:0; background:transparent; } form { display:grid; gap:16px; } .section { display:grid; gap:11px; } h2 { margin:0 0 4px; color:#112034; font-size:14px; } label { display:block; } label > span { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; font-weight:500; } .control { display:flex; min-height:43px; align-items:center; border:1px solid var(--field); border-radius:8px; background:#fff; } .control:focus-within { border-color:var(--pink); box-shadow:0 0 0 3px rgba(246,37,112,.1); } .control > i { width:37px; flex:0 0 37px; color:#545768; font-size:19px; font-style:normal; text-align:center; } input,select,textarea { min-width:0; width:100%; color:#4a4d60; border:0; outline:0; background:transparent; } input,select { padding:11px 10px; font-size:12px; font-weight:600; } select { appearance:none; } .select-control:after { margin-right:13px; content:"⌄"; font-size:17px; font-weight:700; } .view { margin-right:9px; padding:5px 10px; color:#f0526d; font-size:10px; border:0; border-radius:8px; background:#ffebeb; } textarea { min-height:72px; padding:10px 12px; resize:vertical; font-size:12px; border:1px solid var(--field); border-radius:8px; background:#fbfcfd; } textarea:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(246,37,112,.1); } .actions { display:flex; gap:12px; } .actions a,.actions button { display:grid; min-height:46px; flex:1; place-items:center; font-size:12px; font-weight:700; text-decoration:none; border-radius:14px; } .cancel { color:var(--muted); border:1px solid var(--line); background:#fff; } .save { flex:1.5 !important; color:#fff; border:0; background:linear-gradient(105deg,var(--pink),var(--coral)); box-shadow:0 9px 18px rgba(246,37,112,.16); } .status { min-height:18px; margin:0; color:var(--pink); font-size:11px; text-align:center; }
		@media (max-width:759px) { body { background:var(--paper); } .page { width:100%; min-height:100vh; margin:0; border-radius:0; box-shadow:none; } } @media (max-width:420px) { .page { padding-right:18px; padding-left:18px; } .actions { flex-direction:column-reverse; } .save { flex:auto !important; } }
	</style>
</head>
<body><main class="page"><header><a class="back" href="#vaults" aria-label="Back to my vaults">←</a><div><p class="eyebrow">Arcane Vault</p><h1>Edit password</h1></div></header><section class="summary" aria-label="Password summary"><div class="service-icon">M</div><div class="summary-copy"><strong>Messenger</strong><span>Update the saved credentials for this service.</span></div><button class="favorite" type="button" aria-label="Remove favorite">♥</button></section><form><section class="section" aria-labelledby="credential-title"><h2 id="credential-title">Credential details</h2><label><span>Category</span><div class="control select-control"><select aria-label="Category"><option>Social media</option><option>Browser</option><option>Mobile app</option><option>Payment</option></select></div></label><label><span>Site address</span><div class="control"><i>⊕</i><input type="url" value="https://www.messenger.com" aria-label="Site address"></div></label><label><span>User name</span><div class="control"><i>♧</i><input type="email" value="hello@designmonk.com" aria-label="User name"></div></label><label><span>Password</span><div class="control"><i>🔒</i><input id="password" type="password" value="vault-password" aria-label="Password"><button class="view" type="button" onclick="const field=document.getElementById('password'); field.type=field.type==='password'?'text':'password'; this.textContent=field.type==='password'?'View':'Hide';">View</button></div></label></section><section class="section" aria-labelledby="notes-title"><h2 id="notes-title">Notes</h2><textarea aria-label="Notes">Primary Messenger account.</textarea></section><div class="actions"><a class="cancel" href="#vaults">Cancel</a><button class="save" type="button" onclick="document.getElementById('status').textContent='Your password has been updated.'; this.textContent='Saved';">Save changes</button></div><p class="status" id="status" role="status" aria-live="polite"></p></form></main></body>
</html>
